name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pin Ruff to match pre-commit hook
        # Pre-commit pins ruff at v0.1.8; pin CI to the same version so
        # ruff format --check agrees with what pre-commit ran locally.
        run: pip install "ruff==0.1.8"

      - name: Lint with Ruff
        # Lint all source trees. ruff format --check is intentionally omitted:
        # the pre-commit hook (v0.1.8) only runs `ruff` (linting), not
        # `ruff-format`, so there is no local formatter to stay in sync with.
        run: |
          ruff check src/ tests/

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        env:
          DB_BACKEND: sqlite
          KNOWLEDGE_DATA_DIR: /tmp/lore-test-ci

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image required: _init_schema probes for the vector extension
        # and creates kb_embeddings / HNSW index when LORE_SEMANTIC_SEARCH=true.
        # Telemetry + hard_negative_pairs tables are also auto-created by _init_schema.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lore_user
          POSTGRES_PASSWORD: lore
          POSTGRES_DB: lore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lore_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # [semantic] pulls in sentence-transformers + onnxruntime + pgvector so
        # the live KB CRUD/FTS/semantic/hybrid integration tests actually RUN
        # (with LORE_SEMANTIC_SEARCH=true below) instead of skipping. Without
        # the embedder, _embed_kb_entry() can't populate kb_embeddings and the
        # KB-path tests skip on the _pg_available() guard.
        run: pip install -e ".[dev,semantic]"

      - name: Cache embedding model
        # all-MiniLM-L6-v2 (~90MB ONNX) is downloaded from the HF hub on first
        # encode. Cache it across runs so the integration job stays fast.
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-onnx

      - name: Pre-warm embedding model
        # Download + load all-MiniLM-L6-v2 once here so the heavy first encode
        # happens OUTSIDE the 30s per-test timeout (pyproject [tool.pytest]).
        # On a cache hit this is a fast no-op; on a cache miss it populates the
        # cache restored above and keeps the timed test run snappy.
        env:
          LORE_SEMANTIC_SEARCH: "true"
        run: python -c "from lore.embeddings import encode_text; print('embed dim', len(encode_text('warmup')))"

      - name: Bootstrap Postgres schema
        # Loads the base knowledge schema that LocalPostgresClient._init_schema
        # expects to find. The rest (kb_embeddings, retrieval_telemetry,
        # hard_negative_pairs) is auto-created by _init_schema on first connect.
        env:
          PGPASSWORD: lore
        run: |
          psql -h localhost -U lore_user -d lore \
            -f scripts/ci_bootstrap_schema.sql

      - name: Run integration tests
        # --cov-fail-under=0: the integration suite only exercises Postgres paths
        # (~35% coverage on its own), so the global fail_under threshold in
        # pyproject.toml doesn't apply here. Coverage is still measured for
        # visibility. The `test` job (unit suite) enforces the real floor.
        env:
          DB_BACKEND: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: lore
          DB_USER: lore_user
          DB_PASSWORD: lore
          LORE_HARD_NEGATIVE_MINING: "true"
          # Enables the KB write-path embedder + semantic/hybrid search so the
          # Postgres KB CRUD/FTS/search tests in test_postgres_embeddings.py run
          # for real (they skip on the _pg_available() guard otherwise).
          LORE_SEMANTIC_SEARCH: "true"
          LORE_ENV: staging
          KNOWLEDGE_DATA_DIR: /tmp/lore-test-ci
        run: pytest tests/integration/ -v --tb=short -m "integration or slow" --cov-fail-under=0
