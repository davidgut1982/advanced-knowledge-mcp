name: lore
version: 0.1.0
description: >-
  Lore memory provider for Nous Hermes. Backs the agent with Lore
  (a KB-MCP server at http://192.168.1.21:5555) as its persistent memory
  backend: hybrid-search recall via prefetch, turn capture with
  context-fencing, and end-of-session persistence under the
  hermes-conversations topic for later summarization by hermes-scheduler.
author: cluster-ops
provider_type: memory
entry_point: register
config_namespace: lore
config:
  # Per-turn prefetch tuning. recall_mode/dedup_threshold/write_frequency are
  # documented in get_config_schema(); these are the prefs-cache knobs.
  recall_mode: semantic        # pgvector ANN (~0.05s) vs hybrid tsvector+pgvector (~4s); semantic is 80× faster and better for conceptual recall
  prefs_enabled: false        # surface cached user prefs in the recall block
  prefs_topic: hermes-user-prefs
  prefs_cache_ttl: 300        # seconds; invalidated on writes to prefs_topic
  auto_extract:
    enabled: false              # set true + OPENROUTER_API_KEY to activate
    provider: openrouter          # options: openrouter, cerebras
    model: meta-llama/llama-3.1-8b-instruct
    provider_order:               # openrouter only: backend preference
      - Groq
      - Together
      - Fireworks
    # --- Cerebras alternative (comment out openrouter block above) ---
    # provider: cerebras
    # model: gpt-oss-120b         # 300+ TPS, 91-99% cache hit
    confidence_threshold: 0.75
    dedup_similarity_threshold: 0.12   # hybrid kb_search rrf_score (~0.0-0.3, higher = more similar), NOT cosine
    rolling_window: false       # enable mid-session extraction for long sessions
    rolling_stride: 15          # fire extraction every N new turns
    rolling_overlap: 5          # look back N turns into prev window for context
    min_turns: 3
    max_turns: 20           # cap: use last N turns; prevents huge sessions from blowing context
    min_turn_chars: 20      # skip turns shorter than this after cleaning (noise filter)
    max_turn_chars: 1200    # truncate individual turns to this length
requires:
  - httpx
