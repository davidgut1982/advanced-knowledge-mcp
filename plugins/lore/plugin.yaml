name: lore
version: 0.1.0
description: >-
  Lore memory provider for Nous Hermes. Backs the agent with Lore
  (a KB-MCP server at http://192.168.1.21:5555) as its persistent memory
  backend: hybrid-search recall via prefetch, turn capture with
  context-fencing, and end-of-session persistence under the
  hermes-conversations topic for later summarization by hermes-scheduler.
author: cluster-ops
provider_type: memory
entry_point: register
config_namespace: lore
config:
  # Per-turn prefetch tuning. recall_mode/dedup_threshold/write_frequency are
  # documented in get_config_schema(); these are the prefs-cache knobs.
  recall_mode: semantic        # pgvector ANN (~0.05s) vs hybrid tsvector+pgvector (~4s); semantic is 80× faster and better for conceptual recall
  prefs_enabled: false        # surface cached user prefs in the recall block
  prefs_topic: hermes-user-prefs
  prefs_cache_ttl: 300        # seconds; invalidated on writes to prefs_topic
requires:
  - httpx
